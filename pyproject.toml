[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-desktop"
version = "0.7.2"
description = "Local Windows assistant with animated overlay, Ollama and voice"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6==6.12.0", "python-dotenv==1.2.4", "openwakeword==0.6.0", "faster-whisper==1.2.1"]

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis.ui" = ["*.qss", "neural/*.html", "neural/*.css", "neural/*.js"]
"jarvis.memory" = ["migrations/*.sql"]
"jarvis.tools" = ["*.ps1"]
"jarvis.infrastructure" = ["*.ps1"]
"jarvis.browser" = ["*.ps1", "*.js"]

[tool.setuptools.data-files]
"share/jarvis/third_party/PersonalJarvis" = ["third_party/PersonalJarvis/LICENSE", "third_party/PersonalJarvis/NOTICE", "third_party/PersonalJarvis/README.md"]
